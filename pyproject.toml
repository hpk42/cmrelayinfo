[build-system]
requires = ["setuptools>=68", "setuptools-git-versioning >=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "cmrelayinfo"
readme = "README.md"
description = "report chatmail relay capabilities (iroh relay, TURN, maxsmtprecipients, quota)"
requires-python = ">=3.11"
dependencies = [
  "deltachat-rpc-server>=2.24.0",
  "deltachat-rpc-client>=2.24.0",
  "xdg-base-dirs>=6.0.2",
]

dynamic = ["version"]

[tool.setuptools-git-versioning]
enabled = true

[dependency-groups]
test = [
  "pytest",
]

[tool.setuptools]
py-modules = ["cmrelayinfo"]

[project.urls]
Repository = "https://github.com/hpk42/cmrelayinfo"
Changelog = "https://github.com/hpk42/cmrelayinfo/blob/main/CHANGELOG.md"

[project.scripts]
cmrelayinfo = "cmrelayinfo:main"

[tool.pytest.ini_options]
# The deltachat_rpc_client pytest plugin is not used and would need
# extra dependencies (execnet) to even load.
addopts = "-v -ra --strict-markers -m 'not online' -p no:deltachat_rpc_client.pytestplugin"
markers = [
  "online: tests that need network access to real relays (deselected by default)",
]

[tool.ruff]
lint.select = [
  "F", # Pyflakes
  "I", # isort

  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "PLW", # Pylint Warning
]
lint.ignore = [
  "PLC0415" # import-outside-top-level
]
